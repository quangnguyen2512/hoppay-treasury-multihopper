[project]
name = "hoppay-treasury"
version = "1.0.0"
description = "HopPay Treasury — Multi-Destination Programmable Solana Payroll, Custom Routes & Agent Treasury Router powered by MultiHopper v1 API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "anyio>=4.0.0",
]
signer = [
    "solders>=0.21.0",
    "base58>=2.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoppay"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
